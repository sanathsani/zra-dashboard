<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZRA CEC — Dashboard &amp; Client Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   ZRA CEC — design system
   Surfaces: a cool paper canvas so white cards lift off it.
   Colour: blue = L1 / primary, orange = L3, teal = automated, green / amber /
   red = state. One meaning per hue, everywhere.
   Motion: Material 3 easing + duration tokens (standard for utility, emphasised
   decelerate for anything entering).
   ========================================================================= */
:root {
  color-scheme: light;

  --bg:        #e9edf3;
  --bg2:       #f3f6fa;
  --card:      #ffffff;
  --card2:     #f7f9fc;
  --raise:     #eaeff6;
  --ink:       #101829;
  --ink2:      #46536b;
  --ink3:      #78849a;
  --line:      #dbe2ec;
  --line2:     #e9edf3;
  --mark:      #9aa6ba;
  --marksoft:  #e4e9f1;

  --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;
  --s1t: rgba(42,120,214,.10);  --s1b: rgba(42,120,214,.26);
  --s2t: rgba(235,104,52,.10);  --s2b: rgba(235,104,52,.28);
  --s3t: rgba(27,175,122,.11);  --s3b: rgba(27,175,122,.30);

  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --goodt: rgba(12,163,12,.11); --warnt: rgba(250,178,25,.14); --critt: rgba(208,59,59,.10);
  --good-ink: #067806; --crit-ink: #b02c2c; --warn-ink: #8a6100;

  --ord1: #dce9fa; --ord2: #a8ccf3; --ord3: #6ba6e9; --ord4: #2a78d6; --ord5: #1a4e8f;

  --navy: #16283f; --navy2: #0e1c2e;
  --res-bar: #3f4c60;

  --shadow-1: 0 1px 2px rgba(16,24,41,.05), 0 1px 3px rgba(16,24,41,.04);
  --shadow-2: 0 2px 4px rgba(16,24,41,.05), 0 8px 20px rgba(16,24,41,.07);
  --shadow-3: 0 6px 14px rgba(16,24,41,.08), 0 18px 44px rgba(16,24,41,.10);

  --radius: 14px;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* motion — M3 tokens */
  --e-std: cubic-bezier(.2, 0, 0, 1);
  --e-dec: cubic-bezier(.05, .7, .1, 1);
  --e-acc: cubic-bezier(.3, 0, .8, .15);
  --t-fast: 150ms;
  --t-mid:  250ms;
  --t-slow: 400ms;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:        #090c12;
  --bg2:       #10151d;
  --card:      #141a23;
  --card2:     #1a212c;
  --raise:     #212936;
  --ink:       #eef2f8;
  --ink2:      #a9b5c7;
  --ink3:      #77839a;
  --line:      #2a3444;
  --line2:     #202836;
  --mark:      #5f6c82;
  --marksoft:  #273141;

  --s1: #4a92ea;  --s2: #f07a4c;  --s3: #22c08a;
  --s1t: rgba(74,146,234,.14); --s1b: rgba(74,146,234,.32);
  --s2t: rgba(240,122,76,.13); --s2b: rgba(240,122,76,.32);
  --s3t: rgba(34,192,138,.13); --s3b: rgba(34,192,138,.32);

  --goodt: rgba(12,163,12,.16); --warnt: rgba(250,178,25,.14); --critt: rgba(208,59,59,.16);
  --good-ink: #35c635; --crit-ink: #ef7c7c; --warn-ink: #e0aa2c;

  --ord1: #17304e; --ord2: #1e4a78; --ord3: #2f6dae; --ord4: #4a92ea; --ord5: #85b6f0;

  --navy: #1b2a3e; --navy2: #101b28;
  --res-bar: #7d8ba3;

  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 2px 6px rgba(0,0,0,.45);
  --shadow-3: 0 10px 34px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  background-image: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 46%);
  background-attachment: fixed;
  color: var(--ink);
  font-size: 13.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv05" 1, "ss03" 1;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 640; letter-spacing: -.014em; }
table { border-collapse: collapse; width: 100%; }
::selection { background: var(--s1t); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 6px; }

.num-tab { font-variant-numeric: tabular-nums; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop  { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
.reveal { opacity: 0; }
.reveal--in { animation: rise var(--t-slow) var(--e-dec) both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .reveal { opacity: 1; }
}

/* ───────────────────────── sign in ───────────────────────── */
.gate {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background:
    radial-gradient(900px 460px at 50% -10%, var(--s1t), transparent 70%),
    radial-gradient(760px 420px at 92% 108%, var(--s3t), transparent 70%),
    var(--bg);
}
.gate__card {
  width: 100%; max-width: 388px; background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 34px 32px 26px; box-shadow: var(--shadow-3);
  animation: rise var(--t-slow) var(--e-dec) both;
}
.gate__mark {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--s1), #1a4e8f); color: #fff;
  font-weight: 700; font-size: 13px; letter-spacing: .02em; box-shadow: var(--shadow-2);
}
.gate h1 { font-size: 21px; margin: 20px 0 5px; }
.gate p  { margin: 0 0 24px; color: var(--ink3); font-size: 12.5px; }
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; font-weight: 640; letter-spacing: .05em;
  text-transform: uppercase; color: var(--ink3); margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 11px 13px; font: inherit; color: var(--ink);
  background: var(--card2); border: 1px solid var(--line); border-radius: 10px; outline: none;
  transition: border-color var(--t-fast) var(--e-std), box-shadow var(--t-fast) var(--e-std);
}
.field input:focus { border-color: var(--s1); box-shadow: 0 0 0 3px var(--s1t); }
.gate__err {
  font-size: 12.5px; color: var(--crit-ink); background: var(--critt);
  border: 1px solid var(--critt); padding: 10px 12px; border-radius: 9px; margin-bottom: 14px;
}
.gate__foot { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line2);
  font-size: 11.5px; color: var(--ink3); line-height: 1.7; }

/* ───────────────────────── shell ───────────────────────── */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 228px; flex: 0 0 228px; background: var(--card); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.sidebar__brand { display: flex; gap: 11px; align-items: center; padding: 18px 16px 17px;
  border-bottom: 1px solid var(--line2); }
.sidebar__mark {
  width: 33px; height: 33px; flex: none; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--s1), #1a4e8f); color: #fff;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
}
.sidebar__nav { padding: 12px 10px; flex: 1; overflow-y: auto; }
.sidebar__group {
  font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
  color: var(--ink3); padding: 16px 8px 7px;
}
.sidebar__group:first-child { padding-top: 2px; }
.navitem {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; margin-bottom: 2px; background: none; border: 0; border-radius: 9px;
  text-align: left; color: var(--ink2); font-size: 13px;
  transition: background var(--t-fast) var(--e-std), color var(--t-fast) var(--e-std);
}
.navitem::before {
  content: ''; position: absolute; left: -10px; top: 50%; width: 3px; height: 0;
  background: var(--s1); border-radius: 0 3px 3px 0; transform: translateY(-50%);
  transition: height var(--t-mid) var(--e-dec);
}
.navitem:hover { background: var(--raise); color: var(--ink); }
.navitem--active { background: var(--s1t); color: var(--s1); font-weight: 640; }
.navitem--active::before { height: 20px; }
.navitem--active .navitem__icon { color: var(--s1); }
.navitem__icon { width: 15px; text-align: center; font-size: 12px; color: var(--ink3); }
.navitem__badge {
  margin-left: auto; font-size: 10.5px; font-weight: 650; padding: 1px 7px; border-radius: 20px;
  background: var(--marksoft); color: var(--ink2); font-variant-numeric: tabular-nums;
}
.navitem__badge--alert { background: var(--critt); color: var(--crit-ink); }
.sidebar__foot { padding: 14px 16px; border-top: 1px solid var(--line2); font-size: 11.5px; color: var(--ink3); }
.sidebar__user { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.avatar {
  width: 27px; height: 27px; border-radius: 50%; color: #fff;
  background: linear-gradient(140deg, var(--s1), #1a4e8f);
  display: grid; place-items: center; font-size: 10px; font-weight: 700;
}
.livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block;
  box-shadow: 0 0 0 3px var(--goodt); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 13px 26px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30;
}
.topbar__title { font-size: 17.5px; }
.topbar__sub { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }
.topbar__spacer { flex: 1; }
.content { padding: 24px 26px 70px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; font-size: 12.5px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: var(--ink2);
  box-shadow: var(--shadow-1);
  transition: background var(--t-fast) var(--e-std), color var(--t-fast) var(--e-std),
              border-color var(--t-fast) var(--e-std), transform var(--t-fast) var(--e-std),
              box-shadow var(--t-fast) var(--e-std);
}
.btn:hover { background: var(--card); color: var(--ink); border-color: var(--mark); box-shadow: var(--shadow-2); }
.btn:active { transform: translateY(1px); box-shadow: var(--shadow-1); }
.btn--primary { background: var(--s1); border-color: var(--s1); color: #fff; }
.btn--primary:hover { background: #1f66bd; border-color: #1f66bd; color: #fff; }
.btn--icon { padding: 7px 9px; }
.btn--sm { padding: 5px 10px; font-size: 12px; border-radius: 9px; }
.btn--ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink3); }
.btn--ghost:hover { background: var(--raise); box-shadow: none; }
.chip {
  font-size: 11.5px; padding: 4px 11px; border-radius: 20px; background: var(--card);
  border: 1px solid var(--line); color: var(--ink2); font-variant-numeric: tabular-nums;
}

.menu { position: relative; }
.menu__pop {
  position: absolute; right: 0; top: calc(100% + 7px); min-width: 214px; background: var(--card);
  border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow-3); padding: 6px; z-index: 60;
  animation: pop var(--t-mid) var(--e-dec) both; transform-origin: top right;
}
.menu__opt {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 11px; border: 0;
  background: none; border-radius: 8px; font-size: 12.5px; color: var(--ink2); text-align: left;
  transition: background var(--t-fast) var(--e-std), color var(--t-fast) var(--e-std);
}
.menu__opt:hover { background: var(--raise); color: var(--ink); }
.menu__opt b { margin-left: auto; font-weight: 700; color: var(--s1); }
.dr__custom { border-top: 1px solid var(--line2); margin-top: 6px; padding: 11px 11px 6px; }
.dr__custom label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink3); }
.dr__custom input { width: 100%; margin: 4px 0 9px; padding: 7px 9px; font: inherit; font-size: 12.5px;
  background: var(--card2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }

/* ───────────────────────── cards ───────────────────────── */
.grid { display: grid; gap: 16px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-1); display: flex; flex-direction: column; overflow: hidden;
  transition: box-shadow var(--t-mid) var(--e-std), transform var(--t-mid) var(--e-std);
}
.card:hover { box-shadow: var(--shadow-2); }
.card__head { padding: 16px 18px 0; }
.card__title { font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card__sub { font-size: 11.5px; color: var(--ink3); margin-top: 3px; }
.card__body { padding: 15px 18px 18px; flex: 1; display: flex; flex-direction: column; }
.chart--fill { flex: 1; min-height: 210px; display: flex; flex-direction: column; justify-content: center; }

/* Overview KPI tile */
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 17px 15px; box-shadow: var(--shadow-1); position: relative;
  border-top: 3px solid var(--mark);
  transition: box-shadow var(--t-mid) var(--e-std), transform var(--t-mid) var(--e-std);
}
.kpi:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.kpi__label {
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink3); display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
}
.kpi__label::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--mark); flex: none; }
.kpi__value { font-size: 31px; font-weight: 640; letter-spacing: -.028em; line-height: 1.04;
  font-variant-numeric: tabular-nums; }
.kpi__note { font-size: 11.5px; color: var(--ink3); margin-top: 7px; }
.kpi--blue   { border-top-color: var(--s1); }
.kpi--blue .kpi__label { color: var(--s1); } .kpi--blue .kpi__label::before { background: var(--s1); }
.kpi--orange { border-top-color: var(--s2); }
.kpi--orange .kpi__label { color: var(--s2); } .kpi--orange .kpi__label::before { background: var(--s2); }
.kpi--teal   { border-top-color: var(--s3); }
.kpi--teal .kpi__label { color: var(--s3); } .kpi--teal .kpi__label::before { background: var(--s3); }
.kpi--good   { border-top-color: var(--good); }
.kpi--good .kpi__label { color: var(--good-ink); } .kpi--good .kpi__label::before { background: var(--good); }
.kpi--warn   { border-top-color: var(--warn); }
.kpi--warn .kpi__label { color: var(--warn-ink); } .kpi--warn .kpi__label::before { background: var(--warn); }
.kpi--crit   { border-top-color: var(--crit); }
.kpi--crit .kpi__label { color: var(--crit-ink); } .kpi--crit .kpi__label::before { background: var(--crit); }

/* Explore-style metric box */
.mbox {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 15px 17px 16px; box-shadow: var(--shadow-1); min-width: 0; position: relative;
  overflow: hidden;
  transition: box-shadow var(--t-mid) var(--e-std), transform var(--t-mid) var(--e-std),
              border-color var(--t-mid) var(--e-std);
}
.mbox::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--s1); opacity: 0; transition: opacity var(--t-mid) var(--e-std);
}
.mbox:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.mbox:hover::after { opacity: 1; }
.mbox__label { font-size: 12px; color: var(--ink2); line-height: 1.4; display: block;
  min-height: 34px; margin-bottom: 6px; }
.mbox__value { font-size: 33px; font-weight: 600; letter-spacing: -.026em; color: var(--ink);
  line-height: 1.05; font-variant-numeric: tabular-nums; }
.mbox__foot { font-size: 11.5px; color: var(--ink3); margin-top: 6px; }
.mgrid { display: grid; gap: 13px; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); }

.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 0; }
.kv + .kv { border-top: 1px solid var(--line2); }
.kv__k { font-size: 12.5px; color: var(--ink2); display: flex; align-items: center; gap: 8px;
  min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv__v { font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv__pct { font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; width: 48px; text-align: right; }

.swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 11.5px; color: var(--ink2); margin-top: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }

/* ───────────────────────── tables ─────────────────────────
   Whitespace and one hairline separator carry the structure; numbers right,
   tabular and heavier than the labels beside them. */
.tblwrap { border: 1px solid var(--line); border-radius: 12px; overflow: auto; background: var(--card); }
table.tbl { font-size: 13px; }
.tbl th {
  text-align: left; font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink3); padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
  background: var(--card2); position: sticky; top: 0; z-index: 2;
}
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.tbl .num--soft { font-weight: 450; color: var(--ink3); }
.tbl .lead { font-weight: 600; }
.tbl .idx { color: var(--ink3); font-variant-numeric: tabular-nums; width: 34px; }
.tbl tbody tr { transition: background var(--t-fast) var(--e-std); }
.tbl tbody tr:hover { background: var(--card2); }
.tbl tfoot td { padding: 12px 14px; border-top: 2px solid var(--line); font-weight: 680;
  background: var(--raise); position: sticky; bottom: 0; }
.tbl tfoot .num { font-weight: 700; }

.pill { font-size: 10.5px; font-weight: 650; padding: 2px 9px; border-radius: 20px; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.pill--good { background: var(--goodt); color: var(--good-ink); }
.pill--warn { background: var(--warnt); color: var(--warn-ink); }
.pill--crit { background: var(--critt); color: var(--crit-ink); }
.pill--blue { background: var(--s1t); color: var(--s1); }
.pill--orange { background: var(--s2t); color: var(--s2); }
.pill--mute { background: var(--marksoft); color: var(--ink2); }

.meter { height: 7px; border-radius: 4px; background: var(--marksoft); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px;
  transition: width var(--t-slow) var(--e-dec); }
.split { display: flex; height: 11px; border-radius: 6px; overflow: hidden; background: var(--marksoft); gap: 2px; }
.split > i { display: block; height: 100%; transition: width var(--t-slow) var(--e-dec); }
.empty { padding: 30px; text-align: center; color: var(--ink3); font-size: 12.5px; }

/* toggle for hidden columns / hidden tables */
.moretog { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
.moretog span { font-size: 11.5px; color: var(--ink3); }

/* ── time-bracket bars ── */
.brow { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; margin-bottom: 11px; }
.brow:last-child { margin-bottom: 0; }
.blab { font-size: 12.5px; color: var(--ink2); text-align: right; white-space: nowrap; }
.btrack { position: relative; height: 26px; border-radius: 6px; background: var(--marksoft); overflow: hidden; }
.bfill {
  position: absolute; inset: 0 auto 0 0; border-radius: 6px; display: flex; align-items: center;
  justify-content: flex-end; padding-right: 9px; color: #fff; font-size: 12px; font-weight: 700;
  font-variant-numeric: tabular-nums; width: 0; animation: grow .55s var(--e-dec) forwards;
}
.bout { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700;
  color: var(--ink); font-variant-numeric: tabular-nums; }
@keyframes grow { to { width: var(--w); } }
@media (prefers-reduced-motion: reduce) { .bfill { animation: none; width: var(--w); } }
.srcnote { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink3);
  background: var(--card2); border: 1px dashed var(--line); border-radius: 9px; padding: 9px 12px; margin-top: 15px; }

  return p.length < 3 ? iso || '' : `${+p[2]} ${MON[+p[1] - 1]} ${p[0]}`;

  const p = dayKey(iso).split('-');

  const [y, m] = (k || '').split('-');
  return `${(long ? MON_LONG : MON)[+m - 1] || ''} ${y || ''}`.trim();
}

  while (t < 0) t += 1440;
  const hh = Math.floor(t / 60) % 24, mm = t % 60;
  const ap = hh < 12 ? 'AM' : 'PM';
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return `${h12}:${String(mm).padStart(2, '0')} ${ap}`;
}

const bounds = {
  from: FEED.meta.dateFrom,
  to: FEED.meta.dateTo,
};

function presets() {
  const end = bounds.to;
  const clamp = f => (f < bounds.from ? bounds.from : f);
  return [
    { id: '7d',  label: 'Last 7 days',   from: clamp(addDays(end, -6)),  to: end },
    { id: '14d', label: 'Last 14 days',  from: clamp(addDays(end, -13)), to: end },
    { id: '30d', label: 'Last 30 days',  from: clamp(addDays(end, -29)), to: end },
    { id: 'mtd', label: 'Month to date', from: clamp(end.slice(0, 8) + '01'), to: end },
    { id: 'aug', label: 'August 2026',   from: '2026-08-01', to: '2026-08-31' },
    { id: 'all', label: 'All time',      from: bounds.from,  to: end },
  ];
}

/* Stable order over the WHOLE dataset, so a filter never repaints survivors. */
const STABLE = (() => {
  const tally = i => {
    const m = new Map();
    FEED.tickets.forEach(t => { const v = t[i]; if (v >= 0) m.set(v, (m.get(v) || 0) + 1); });
    return [...m.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  };
  return { owners: tally(C.owner), cats: tally(C.cat), customers: tally(C.cust) };
})();

/* SLA breach rows keyed by ticket id — the sheet holds breaches only. */
const SLA_BY_ID = FEED.sla.reduce((a, r) => (a[r.id] = r, a), {});
const isFR  = r => /first response|response &/i.test(r.breach);
const isRES = r => /resolution/i.test(r.breach);

/* Names that must never appear in a customer list on screen or in a deck —
   a bucket label invites questions it cannot answer. The tickets still count
   in every total; only the row is withheld. */
const HIDDEN_CUSTOMERS = new Set(['other', 'others', 'unknown', 'n/a', 'na', '-', '']);
const isHiddenCustomer = name => HIDDEN_CUSTOMERS.has(String(name || '').trim().toLowerCase());

const AGE_BUCKETS = [
  { label: '< 1 day',  lo: 0,  hi: 1 },
  { label: '1 – 3 days', lo: 1, hi: 3 },
  { label: '3 – 5 days', lo: 3, hi: 5 },
  { label: '> 5 days', lo: 5,  hi: 1e9 },
];
/* Explore's own bracket edges, in hours. */
const RES_BUCKETS = [
  { label: '0 - 1 hrs',  lo: 0,   hi: 1 },
  { label: '1 - 24 hrs', lo: 1,   hi: 24 },
  { label: '1 - 3 days', lo: 24,  hi: 72 },
  { label: '3 - 5 days', lo: 72,  hi: 120 },
  { label: '> 5 days',   lo: 120, hi: 1e9 },
];
const FR_BUCKETS = [
  { label: '0 - 1 hrs',  lo: 0,   hi: 1 },
  { label: '1 - 8 hrs',  lo: 1,   hi: 8 },
  { label: '8 - 24 hrs', lo: 8,   hi: 24 },
  { label: '1 - 3 days', lo: 24,  hi: 72 },
  { label: '> 3 days',   lo: 72,  hi: 1e9 },
];
/* The feed carries these two only once the tracker sheet has the columns. */
const HAS_RESPONSE = FEED.cols.indexOf('response') >= 0;
const HAS_RESTORE  = FEED.cols.indexOf('restore')  >= 0;

function derive(from, to) {
  const rows = FEED.tickets.filter(t => {
    const d = dayKey(t[C.created]);
    return d >= from && d <= to;
  });

  const total = rows.length;
  let solved = 0, pending = 0, progress = 0, l1 = 0, l3 = 0, auto = 0;
  let l1Solved = 0, l3Solved = 0, l1Open = 0, l3Open = 0, autoOpen = 0, custOpen = 0;
  let l1Pending = 0, l1Progress = 0, l3Pending = 0, l3Progress = 0;

  const byDay = new Map(), byMonth = new Map(), byHour = Array.from({ length: 24 }, () => 0);
  const byShift = [0, 0, 0], shiftSolved = [0, 0, 0];
  const byOwner = new Map(), byCat = new Map(), byCust = new Map(), byRobot = new Map();
  const ageCount = AGE_BUCKETS.map(() => ({ all: 0, l1: 0, l3: 0 }));
  const resCount = RES_BUCKETS.map(() => 0);
  const frCount = FR_BUCKETS.map(() => 0);
  let frNone = 0, frKnown = 0;
  /* Aging is measured at the END OF THE PERIOD, not today. A review of
     24 Aug – 6 Sep must show what was aging on 6 Sep, not how old those
     tickets have since become. */
  const today = to;

  for (const t of rows) {
    const st = t[C.status], isL3 = t[C.lvl] === 1, open = st !== ST.SOLVED;
    if (st === ST.SOLVED) solved++; else if (st === ST.PENDING) pending++; else progress++;
    if (isL3) l3++; else l1++;
    if (t[C.auto]) auto++;
    if (!open) { isL3 ? l3Solved++ : l1Solved++; }
    else {
      isL3 ? l3Open++ : l1Open++;
      if (st === ST.PENDING) { isL3 ? l3Pending++ : l1Pending++; }
      else { isL3 ? l3Progress++ : l1Progress++; }
      t[C.auto] ? autoOpen++ : custOpen++;
      const age = daysBetween(dayKey(t[C.created]), today);
      const bi = AGE_BUCKETS.findIndex(b => age >= b.lo && age < b.hi);
      if (bi >= 0) { ageCount[bi].all++; isL3 ? ageCount[bi].l3++ : ageCount[bi].l1++; }
    }
    /* Restoration: Zendesk's own clock when the sheet holds it, otherwise
       created → solved, which runs longer because it never pauses. */
    if (!open) {
      let h = null;
      if (HAS_RESTORE && t[C.restore] !== '' && t[C.restore] != null) h = Number(t[C.restore]) / 60;
      else if (t[C.solved]) h = hoursBetween(t[C.created], t[C.solved]);
      if (h != null && h >= 0) {
        const bi = RES_BUCKETS.findIndex(b => h >= b.lo && h < b.hi);
        if (bi >= 0) resCount[bi]++;
      }
    }
    /* First response: only Zendesk knows it. Blank means nobody ever replied. */
    if (HAS_RESPONSE) {
      const v = t[C.response];
      if (v === '' || v == null) frNone++;
      else {
        const h = Number(v) / 60;
        const bi = FR_BUCKETS.findIndex(b => h >= b.lo && h < b.hi);
        if (bi >= 0) { frCount[bi]++; frKnown++; }
      }
    }

    const dk = dayKey(t[C.created]), mk = monKey(t[C.created]);
    const day = byDay.get(dk) || { total: 0, solved: 0, open: 0 };
    day.total++; open ? day.open++ : day.solved++; byDay.set(dk, day);
    const mo = byMonth.get(mk) || { total: 0, solved: 0, pending: 0, progress: 0 };
    mo.total++; st === ST.SOLVED ? mo.solved++ : st === ST.PENDING ? mo.pending++ : mo.progress++;
    byMonth.set(mk, mo);

    const h = hourOf(t[C.created]);
    byHour[h]++;
    const si = shiftOf(h);
    byShift[si]++; if (!open) shiftSolved[si]++;

    const o = byOwner.get(t[C.owner]) || { id: t[C.owner], total: 0, l1: 0, l3: 0, solved: 0, open: 0, cats: {} };
    o.total++; isL3 ? o.l3++ : o.l1++; open ? o.open++ : o.solved++;
    o.cats[t[C.cat]] = (o.cats[t[C.cat]] || 0) + 1;
    byOwner.set(t[C.owner], o);

    const c = byCat.get(t[C.cat]) || { id: t[C.cat], total: 0, l1Solved: 0, l3Solved: 0, l1Open: 0, l3Open: 0, cust: 0, auto: 0, custOpen: 0, autoOpen: 0 };
    c.total++;
    if (!open) { isL3 ? c.l3Solved++ : c.l1Solved++; } else { isL3 ? c.l3Open++ : c.l1Open++; }
    t[C.auto] ? c.auto++ : c.cust++;
    if (open) { t[C.auto] ? c.autoOpen++ : c.custOpen++; }
    byCat.set(t[C.cat], c);

    const cu = byCust.get(t[C.cust]) || { id: t[C.cust], total: 0, solved: 0, open: 0, l3: 0, robots: new Set(), cats: {} };
    cu.total++; open ? cu.open++ : cu.solved++; if (isL3) cu.l3++;
    if (t[C.robot] >= 0) cu.robots.add(t[C.robot]);
    cu.cats[t[C.cat]] = (cu.cats[t[C.cat]] || 0) + 1;
    byCust.set(t[C.cust], cu);

    if (t[C.robot] >= 0) {
      const rb = byRobot.get(t[C.robot]) || { id: t[C.robot], cust: t[C.cust], total: 0, open: 0 };
      rb.total++; if (open) rb.open++;
      byRobot.set(t[C.robot], rb);
    }
  }

  /* daily series, gap-filled */
  const daily = [];
  if (total) for (let d = from; d <= to; d = addDays(d, 1)) {
    const v = byDay.get(d) || { total: 0, solved: 0, open: 0 };
    daily.push({ date: d, label: fmtDateShort(d), ...v });
  }

  const monthly = [...byMonth.entries()].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([k, v]) => ({ key: k, label: fmtMonth(k), ...v }));

  /* Agents: ONLY those with tickets in this window. Roster flags come from Config. */
  const roster = FEED.agents.reduce((a, r) => (a[r.name] = r, a), {});
  const owners = STABLE.owners
    .filter(id => byOwner.has(id))
    .map(id => {
      const o = byOwner.get(id), name = DICT.owners[id];
      return { ...o, name, rate: pct(o.solved, o.total),
        status: roster[name]?.status || '—', role: roster[name]?.role || 'Agent' };
    })
    .sort((a, b) => b.total - a.total);
  const dormant = FEED.agents.filter(a => !owners.some(o => o.name === a.name)).map(a => a.name);

  const cats = STABLE.cats.filter(id => byCat.has(id)).map(id => {
    const c = byCat.get(id);
    return { ...c, name: DICT.cats[id], share: pct(c.total, total) };
  }).sort((a, b) => b.total - a.total);

  const customers = [...byCust.values()].map(c => ({
    ...c, name: DICT.customers[c.id], robotCount: c.robots.size, share: pct(c.total, total),
    hidden: isHiddenCustomer(DICT.customers[c.id]),
  })).sort((a, b) => b.total - a.total);
  /* what any list, chart or slide is allowed to show */
  const customersShown = customers.filter(c => !c.hidden);

  const robots = [...byRobot.values()].map(r => ({ ...r, name: DICT.robots[r.id], cust: DICT.customers[r.cust] }))
    .sort((a, b) => b.total - a.total);
  const robotsShown = robots.filter(r => !isHiddenCustomer(r.cust));

  const shifts = SHIFTS.map((s, i) => ({
    ...s, tickets: byShift[i], solved: shiftSolved[i],
    share: pct(byShift[i], total), rate: pct(shiftSolved[i], byShift[i]),
  }));

  /* Peak window = the SHORTEST run of consecutive hours carrying >= 40% of the
     period's tickets. A plain "above average" rule breaks on a one-hour dip;
     this answers the question the client actually asks — when does the day
     concentrate. Ties go to the busiest window. */
  let peak = null;
  if (total) {
    const target = total * 0.4;
    for (let len = 1; len <= 24 && !peak; len++) {
      let best = null;
      for (let s = 0; s < 24; s++) {
        let sum = 0;
        for (let i = 0; i < len; i++) sum += byHour[(s + i) % 24];
        if (sum >= target && (!best || sum > best.tickets)) best = { start: s, len, tickets: sum };
      }
      if (best) peak = { ...best, end: (best.start + best.len) % 24 };
    }
    if (!peak) {
      const mx = Math.max(...byHour), s = byHour.indexOf(mx);
      peak = { start: s, len: 1, end: (s + 1) % 24, tickets: mx };
    }
  }

  /* ── SLA ───────────────────────────────────────────────────────────── */
  const ids = new Set(rows.map(t => t[C.id]));
  const lvlById = {}, autoById = {}, catById = {};
  rows.forEach(t => { lvlById[t[C.id]] = t[C.lvl]; autoById[t[C.id]] = t[C.auto]; catById[t[C.id]] = DICT.cats[t[C.cat]]; });

  const breaches = FEED.sla.filter(r => ids.has(r.id)).map(r => ({
    ...r, lvl: lvlById[r.id] === 1 ? 'L3' : 'L1', auto: !!autoById[r.id],
    cat: r.category || catById[r.id] || '—',
  }));
  const fr = breaches.filter(isFR), res = breaches.filter(isRES);
  const byRca = new Map();
  breaches.forEach(b => {
    const k = b.cat || 'Unclassified';
    byRca.set(k, (byRca.get(k) || 0) + 1);
  });
  const sla = {
    total,
    fr: fr.length, res: res.length, both: breaches.filter(b => isFR(b) && isRES(b)).length,
    frRate: total ? 100 - pct(fr.length, total) : 100,
    resRate: total ? 100 - pct(res.length, total) : 100,
    frCust: fr.filter(b => !b.auto).length, frAuto: fr.filter(b => b.auto).length,
    resL1Cust: res.filter(b => b.lvl === 'L1' && !b.auto).length,
    resL3Cust: res.filter(b => b.lvl === 'L3' && !b.auto).length,
    resL1Auto: res.filter(b => b.lvl === 'L1' && b.auto).length,
    resL3Auto: res.filter(b => b.lvl === 'L3' && b.auto).length,
    rows: breaches.sort((a, b) => (a.created || '').localeCompare(b.created || '')),
    byRca: [...byRca.entries()].map(([k, v]) => ({ name: k, count: v })).sort((a, b) => b.count - a.count),
  };

  const unsolved = rows.filter(t => t[C.status] !== ST.SOLVED)
    .sort((a, b) => (a[C.created] || '').localeCompare(b[C.created] || ''));

  return {
    from, to, rows, total,
    summary: {
      total, solved, pending, progress, open: pending + progress,
      l1, l3, l1Solved, l3Solved, l1Open, l3Open,
      l1Pending, l1Progress, l3Pending, l3Progress,
      auto, cust: total - auto, autoOpen, custOpen,
      rate: pct(solved, total), l1Share: pct(l1, total), l3Share: pct(l3, total),
    },
    daily, monthly, byHour, peak, shifts,
    owners, dormant, cats, customers, customersShown, robots, robotsShown,
    age: AGE_BUCKETS.map((b, i) => ({ ...b, ...ageCount[i] })),
    resTime: RES_BUCKETS.map((b, i) => ({ ...b, count: resCount[i] })),
    brackets: {
      hasResponse: HAS_RESPONSE,
      restoreFromZendesk: HAS_RESTORE,
      response: HAS_RESPONSE
        ? [{ label: 'No replies', count: frNone }]
            .concat(FR_BUCKETS.map((b, i) => ({ label: b.label, count: frCount[i] })))
        : [],
      responseTotal: frNone + frKnown,
      restore: RES_BUCKETS.map((b, i) => ({ label: b.label, count: resCount[i] })),
    },
    sla, unsolved,
  };
}

</script>
<script>
/* =========================================================================
   charts — inline SVG, hairline chrome, hue only where it means something
   ========================================================================= */
const TIP = document.createElement('div');
TIP.className = 'tip';
document.body.appendChild(TIP);
function tipShow(e, html) {
  TIP.innerHTML = html;
  TIP.classList.add('tip--on');
  const pad = 14, w = TIP.offsetWidth, h = TIP.offsetHeight;
  let x = e.clientX + pad, y = e.clientY - h - 10;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y < 8) y = e.clientY + pad;
  TIP.style.left = x + 'px'; TIP.style.top = y + 'px';
}
function tipHide() { TIP.classList.remove('tip--on'); }
document.addEventListener('scroll', tipHide, true);

const svgNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const n = document.createElementNS(svgNS, tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function niceMax(v) {
  if (v <= 5) return 5;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (const s of steps) if (v <= s * mag) return s * mag;
  return 10 * mag;
}
/* rounded only at the data end, anchored to the baseline */
function barPath(x, y, w, h, r, dir) {
  r = Math.min(r, h / 2, w / 2);
  if (h <= 0.4) return `M${x} ${y + h} h${w}`;
  if (dir === 'up')
    return `M${x} ${y + h} V${y + r} a${r} ${r} 0 0 1 ${r} ${-r} h${w - 2 * r} a${r} ${r} 0 0 1 ${r} ${r} V${y + h} Z`;
  return `M${x} ${y} h${w - r} a${r} ${r} 0 0 1 ${r} ${r} v${h - 2 * r} a${r} ${r} 0 0 1 ${-r} ${r} H${x} Z`;
}

/* ── area + line: volume over time ───────────────────────────────────── */
function hostW(host, min) {
  return Math.max(min || 320, Math.round(host.getBoundingClientRect().width) || 1000);
}
function chartArea(host, series, opts = {}) {
  const W = hostW(host), H = opts.height || 210, P = { t: 12, r: 8, b: 26, l: 34 };
  host.innerHTML = '';
  if (!series.length) { host.innerHTML = '<div class="empty">No tickets in this range.</div>'; return; }
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, host);
  svg.style.height = H + 'px';
  const max = niceMax(Math.max(...series.map(d => d.total), 1));
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const X = i => P.l + (series.length === 1 ? iw / 2 : (i / (series.length - 1)) * iw);
  const Y = v => P.t + ih - (v / max) * ih;

  for (let g = 0; g <= 4; g++) {
    const y = P.t + (g / 4) * ih;
    el('line', { x1: P.l, x2: W - P.r, y1: y, y2: y, class: 'grid-line' }, svg);
    el('text', { x: P.l - 7, y: y + 3.5, 'text-anchor': 'end', class: 'axis-label' }, svg)
      .textContent = Math.round(max - (g / 4) * max);
  }
  const line = series.map((d, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(d.total).toFixed(1)}`).join(' ');
  el('path', { d: `${line} L${X(series.length - 1)} ${P.t + ih} L${X(0)} ${P.t + ih} Z`,
    fill: 'var(--s1)', opacity: .1 }, svg);
  el('path', { d: line, fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);

  const ticks = Math.min(W < 560 ? 4 : 7, series.length);
  for (let i = 0; i < ticks; i++) {
    const idx = Math.round((i / (ticks - 1 || 1)) * (series.length - 1));
    el('text', { x: X(idx), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === ticks - 1 ? 'end' : 'middle',
      class: 'axis-label' }, svg).textContent = series[idx].label;
  }
  const cross = el('line', { y1: P.t, y2: P.t + ih, class: 'axis-line', opacity: 0 }, svg);
  const dot = el('circle', { r: 3.5, fill: 'var(--s1)', stroke: 'var(--card)', 'stroke-width': 2, opacity: 0 }, svg);
  const hit = el('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' }, svg);
  hit.addEventListener('mousemove', e => {
    const bb = svg.getBoundingClientRect();
    const rel = ((e.clientX - bb.left) / bb.width) * W;
    const i = Math.max(0, Math.min(series.length - 1,
      Math.round(((rel - P.l) / iw) * (series.length - 1))));
    const d = series[i];
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
    dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(d.total)); dot.setAttribute('opacity', 1);
    tipShow(e, `<div>${fmtDate(d.date)}</div><b>${d.total}</b> tickets · ${d.solved} solved`);
  });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); tipHide(); });
}

/* ── columns: hourly load, peak window emphasised ────────────────────── */
function chartHours(host, byHour, peak, opts = {}) {
  const W = hostW(host), narrow = W < 620;
  const H = opts.height || (narrow ? 210 : 230), P = { t: 14, r: 8, b: narrow ? 46 : 40, l: 34 };
  host.innerHTML = '';
  const total = byHour.reduce((a, b) => a + b, 0);
  if (!total) { host.innerHTML = '<div class="empty">No tickets in this range.</div>'; return; }
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, host);
  svg.style.height = H + 'px';
  const max = niceMax(Math.max(...byHour));
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const slot = iw / 24, bw = Math.max(3, Math.min(slot - (narrow ? 2 : 6), 30));
  const Y = v => P.t + ih - (v / max) * ih;
  const inPeak = h => {
    if (!peak) return false;
    const n = (h - peak.start + 24) % 24;
    return n < peak.len;
  };

  for (let g = 0; g <= 4; g++) {
    const y = P.t + (g / 4) * ih;
    el('line', { x1: P.l, x2: W - P.r, y1: y, y2: y, class: 'grid-line' }, svg);
    el('text', { x: P.l - 7, y: y + 3.5, 'text-anchor': 'end', class: 'axis-label' }, svg)
      .textContent = Math.round(max - (g / 4) * max);
  }
  if (peak && peak.len < 24) {
    const runs = [];
    let s = peak.start;
    if (peak.start + peak.len <= 24) runs.push([peak.start, peak.len]);
    else { runs.push([peak.start, 24 - peak.start]); runs.push([0, peak.len - (24 - peak.start)]); }
    runs.forEach(([st, ln]) => {
      el('rect', { x: P.l + st * slot, y: P.t - 4, width: ln * slot, height: ih + 4,
        fill: 'var(--s1)', opacity: .08, rx: 4 }, svg);
    });
  }
  byHour.forEach((v, h) => {
    const x = P.l + h * slot + (slot - bw) / 2, y = Y(v), hh = P.t + ih - y;
    const hot = inPeak(h);
    /* every hour is coloured; the peak window simply runs darker */
    el('path', { d: barPath(x, y, bw, hh, 4, 'up'),
      fill: hot ? 'var(--ord4)' : 'var(--ord2)' }, svg);
    const r = el('rect', { x: P.l + h * slot, y: P.t, width: slot, height: ih, fill: 'transparent' }, svg);
    r.addEventListener('mousemove', e => tipShow(e,
      `<div>${String(h).padStart(2, '0')}:00 – ${String((h + 1) % 24).padStart(2, '0')}:00 IST</div>
       <b>${v}</b> tickets · ${pct1(v, total)}% of range<div style="opacity:.7">${istToPst(h)} PST</div>`));
    r.addEventListener('mouseleave', tipHide);
  });
  const every = slot < 20 ? (slot < 13 ? 4 : 2) : 1;
  for (let h = 0; h < 24; h++) {
    if (h % every) continue;
    el('text', { x: P.l + h * slot + slot / 2, y: H - (narrow ? 30 : 24), 'text-anchor': 'middle', class: 'axis-label' }, svg)
      .textContent = String(h).padStart(2, '0');
  }
  el('text', { x: P.l, y: H - (narrow ? 16 : 8), class: 'axis-label' }, svg).textContent = 'Hour of day · IST';
  if (peak) {
    const label = `Peak ${String(peak.start).padStart(2, '0')}:00–${String(peak.end).padStart(2, '0')}:00 IST · ${istToPst(peak.start)}–${istToPst(peak.end)} PST`;
    el('text', narrow ? { x: P.l, y: H - 2, class: 'mark-label' }
                      : { x: W - P.r, y: H - 8, 'text-anchor': 'end', class: 'mark-label' }, svg)
      .textContent = label;
  }
}

/* ── horizontal bars: one series, one colour ─────────────────────────── */
function chartBars(host, items, opts = {}) {
  host.innerHTML = '';
  if (!items.length) { host.innerHTML = `<div class="empty">${opts.empty || 'Nothing to show.'}</div>`; return; }
  const max = Math.max(...items.map(d => d.value), 1);
  const wrap = document.createElement('div');
  wrap.style.display = 'grid';
  wrap.style.gap = opts.gap || '7px';
  items.forEach(d => {
    const row = document.createElement('div');
    row.style.cssText = 'display:grid;grid-template-columns:' + (opts.labelWidth || '148px') +
      ' 1fr auto;gap:10px;align-items:center;';
    const lab = document.createElement('div');
    lab.style.cssText = 'font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    lab.textContent = d.label; lab.title = d.label;
    const track = document.createElement('div');
    track.style.cssText = 'height:9px;border-radius:4px;background:var(--line2);overflow:hidden';
    const fill = document.createElement('i');
    fill.style.cssText = `display:block;height:100%;border-radius:4px;width:${(d.value / max) * 100}%;background:${d.color || 'var(--s1)'}`;
    track.appendChild(fill);
    const val = document.createElement('div');
    val.style.cssText = 'font-size:12px;font-weight:640;font-variant-numeric:tabular-nums;min-width:64px;text-align:right';
    val.innerHTML = `${num(d.value)}${d.sub ? ` <span style="color:var(--ink3);font-weight:400">${d.sub}</span>` : ''}`;
    row.append(lab, track, val);
    row.addEventListener('mousemove', e => tipShow(e, d.tip || `<div>${d.label}</div><b>${num(d.value)}</b>`));
    row.addEventListener('mouseleave', tipHide);
    wrap.appendChild(row);
  });
  host.appendChild(wrap);
}

/* ── stacked columns by month ────────────────────────────────────────── */
function chartMonths(host, months, opts = {}) {
  const W = hostW(host), H = opts.height || 200, P = { t: 14, r: 8, b: 32, l: 38 };
  host.innerHTML = '';
  if (!months.length) { host.innerHTML = '<div class="empty">No tickets in this range.</div>'; return; }
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, host);
  svg.style.height = H + 'px';
  const max = niceMax(Math.max(...months.map(m => m.total)));
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const slot = iw / months.length, bw = Math.max(10, Math.min(slot - 26, 74));
  const Y = v => P.t + ih - (v / max) * ih;
  for (let g = 0; g <= 4; g++) {
    const y = P.t + (g / 4) * ih;
    el('line', { x1: P.l, x2: W - P.r, y1: y, y2: y, class: 'grid-line' }, svg);
    el('text', { x: P.l - 7, y: y + 3.5, 'text-anchor': 'end', class: 'axis-label' }, svg)
      .textContent = Math.round(max - (g / 4) * max);
  }
  months.forEach((m, i) => {
    const x = P.l + i * slot + (slot - bw) / 2;
    const segs = [
      { v: m.solved,   c: 'var(--s1)',   n: 'Solved' },
      { v: m.progress, c: 'var(--mark)', n: 'In progress' },
      { v: m.pending,  c: 'var(--warn)', n: 'Pending' },
    ].filter(s => s.v > 0);
    let acc = 0;
    segs.forEach((s, si) => {
      const y0 = Y(acc + s.v), y1 = Y(acc);
      const h = Math.max(1, y1 - y0 - (si < segs.length - 1 ? 2 : 0));
      el('path', { d: barPath(x, y0, bw, h, si === segs.length - 1 ? 4 : 0, 'up'), fill: s.c }, svg);
      acc += s.v;
    });
    el('text', { x: x + bw / 2, y: Y(m.total) - 7, 'text-anchor': 'middle', class: 'mark-label' }, svg)
      .textContent = num(m.total);
    el('text', { x: x + bw / 2, y: H - 12, 'text-anchor': 'middle', class: 'axis-label' }, svg)
      .textContent = m.label;
    const hit = el('rect', { x: P.l + i * slot, y: P.t, width: slot, height: ih, fill: 'transparent' }, svg);
    hit.addEventListener('mousemove', e => tipShow(e,
      `<div>${fmtMonth(m.key, true)}</div><b>${m.total}</b> tickets<div style="opacity:.75">${m.solved} solved · ${m.progress} in progress · ${m.pending} pending</div>`));
    hit.addEventListener('mouseleave', tipHide);
  });
}

/* ── grouped bars: L1 vs L3 per agent ────────────────────────────────── */
function chartAgents(host, owners) {
  host.innerHTML = '';
  if (!owners.length) { host.innerHTML = '<div class="empty">No agent handled a ticket in this range.</div>'; return; }
  const max = Math.max(...owners.map(o => o.total), 1);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:grid;gap:9px';
  owners.forEach(o => {
    const row = document.createElement('div');
    row.style.cssText = 'display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center';
    const lab = document.createElement('div');
    lab.style.cssText = 'font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    lab.textContent = o.name;
    const track = document.createElement('div');
    track.style.cssText = 'display:flex;gap:2px;height:10px;align-items:stretch';
    const a = document.createElement('i');
    a.style.cssText = `display:block;background:var(--s1);border-radius:4px 0 0 4px;width:${(o.l1 / max) * 100}%`;
    const b = document.createElement('i');
    b.style.cssText = `display:block;background:var(--s2);border-radius:0 4px 4px 0;width:${(o.l3 / max) * 100}%`;
    if (!o.l3) a.style.borderRadius = '4px';
    if (!o.l1) b.style.borderRadius = '4px';
    track.append(a, b);
    const val = document.createElement('div');
    val.style.cssText = 'font-size:12px;font-weight:640;font-variant-numeric:tabular-nums;min-width:40px;text-align:right';
    val.textContent = num(o.total);
    row.append(lab, track, val);
    row.addEventListener('mousemove', e => tipShow(e,
      `<div>${o.name}</div><b>${o.total}</b> tickets<div style="opacity:.75">${o.l1} handled at L1 · ${o.l3} escalated to L3</div>`));
    row.addEventListener('mouseleave', tipHide);
    wrap.appendChild(row);
  });
  host.appendChild(wrap);
  const lg = document.createElement('div');
  lg.className = 'legend';
  lg.innerHTML = `<span><i class="swatch" style="background:var(--s1)"></i>L1 · self-served</span>
                  <span><i class="swatch" style="background:var(--s2)"></i>L3 · escalated</span>`;
  host.appendChild(lg);
}

/* ── ordinal buckets (ordered categories → one-hue ramp) ─────────────── */
const ORD = ['var(--ord2)', 'var(--ord3)', 'var(--ord4)', 'var(--ord5)', 'var(--ord5)'];
function chartOrdinal(host, items, opts = {}) {
  chartBars(host, items.map((d, i) => ({ ...d, color: ORD[Math.min(i, ORD.length - 1)] })),
    { labelWidth: opts.labelWidth || '96px', gap: '8px' });
}

/* ── donut: part-to-whole, labelled inside the ring ──────────────────── */
function chartDonut(host, segs, opts = {}) {
  host.innerHTML = '';
  const total = segs.reduce((a, s) => a + s.value, 0);
  if (!total) { host.innerHTML = '<div class="empty">Nothing to show.</div>'; return; }
  const W = Math.max(340, Math.round(host.getBoundingClientRect().width) || 460);
  const H = opts.height || 330;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, host);
  svg.style.height = H + 'px';
  const cx = W / 2, cy = H / 2;
  /* every label sits outside on a leader — a name + number + share is wider
     than any ring band, so inside labels clip on the arc */
  const ro = Math.max(60, Math.min(W / 2 - 104, H / 2 - 30));
  const ri = ro * 0.56;
  const pt = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];

  let a0 = -Math.PI / 2;
  segs.forEach(s => {
    const frac = s.value / total, a1 = a0 + frac * Math.PI * 2, big = frac > .5 ? 1 : 0;
    const [x0, y0] = pt(ro, a0), [x1, y1] = pt(ro, a1);
    const [u0, v0] = pt(ri, a1), [u1, v1] = pt(ri, a0);
    const path = el('path', {
      d: `M${x0} ${y0} A${ro} ${ro} 0 ${big} 1 ${x1} ${y1} L${u0} ${v0} A${ri} ${ri} 0 ${big} 0 ${u1} ${v1} Z`,
      fill: s.color, stroke: 'var(--card)', 'stroke-width': 3,
    }, svg);
    path.addEventListener('mousemove', e => tipShow(e,
      `<div>${esc(s.label)}</div><b>${num(s.value)}</b> tickets · ${pct1(s.value, total)}%`));
    path.addEventListener('mouseleave', tipHide);

    const am = (a0 + a1) / 2, right = Math.cos(am) >= 0;
    const [ex, ey] = pt(ro + 4, am), [mx, my] = pt(ro + 18, am);
    const tx = right ? Math.min(mx + 14, W - 6) : Math.max(mx - 14, 6);
    const anchor = right ? 'start' : 'end';
    el('path', { d: `M${ex} ${ey} L${mx} ${my} L${right ? tx - 7 : tx + 7} ${my}`,
      fill: 'none', stroke: 'var(--line)', 'stroke-width': 1.5 }, svg);
    el('circle', { cx: right ? tx - 4 : tx + 4, cy: my, r: 3.5, fill: s.color }, svg);

    const g = el('g', {}, svg);
    el('text', { x: tx, y: my - 17, 'text-anchor': anchor, fill: 'var(--ink2)',
      'font-size': 11.5, 'font-weight': 600 }, g).textContent = s.label;
    el('text', { x: tx, y: my + 5, 'text-anchor': anchor, fill: 'var(--ink)',
      'font-size': 21, 'font-weight': 680, style: 'font-variant-numeric:tabular-nums' }, g)
      .textContent = num(s.value);
    el('text', { x: tx, y: my + 22, 'text-anchor': anchor, fill: 'var(--ink3)',
      'font-size': 12.5, 'font-weight': 600 }, g).textContent = pct1(s.value, total) + '%';
    a0 = a1;
  });

  el('text', { x: cx, y: cy - 6, 'text-anchor': 'middle', fill: 'var(--ink3)',
    'font-size': 10.5, 'font-weight': 700, style: 'letter-spacing:.08em' }, svg)
    .textContent = (opts.centreLabel || 'TOTAL').toUpperCase();
  el('text', { x: cx, y: cy + 18, 'text-anchor': 'middle', fill: 'var(--ink)',
    'font-size': 23, 'font-weight': 680, style: 'font-variant-numeric:tabular-nums' }, svg)
    .textContent = num(total);
}

/* ── time brackets: Explore's bar, value inside the bar, empties dropped ── */
function chartBracket(host, rows, colour, opts = {}) {
  host.innerHTML = '';
  const live = rows.filter(r => r.count > 0).sort((a, b) => a.count - b.count);
  if (!live.length) {
    host.innerHTML = `<div class="empty">${opts.empty || 'Nothing in this bracket yet.'}</div>`;
    return;
  }
  const max = Math.max(...live.map(r => r.count));
  const total = rows.reduce((a, r) => a + r.count, 0);
  const wrap = document.createElement('div');
  live.forEach((r, i) => {
    const pct = (r.count / max) * 100, inside = pct > 15;
    const row = document.createElement('div');
    row.className = 'brow';
    row.innerHTML = `<span class="blab">${esc(r.label)}</span>
      <span class="btrack">
        <i class="bfill" style="--w:${pct}%;background:${colour};animation-delay:${i * 60}ms">${inside ? num(r.count) : ''}</i>
        ${inside ? '' : `<b class="bout" style="left:calc(${pct}% + 10px)">${num(r.count)}</b>`}
      </span>`;
    row.addEventListener('mousemove', e => tipShow(e,
      `<div>${esc(r.label)}</div><b>${num(r.count)}</b> tickets · ${pct1(r.count, total)}%`));
    row.addEventListener('mouseleave', tipHide);
    wrap.appendChild(row);
  });
  host.appendChild(wrap);
}

<script>
/* =========================================================================

const CDN = {

  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
};
function loadScript(src) {
  return new Promise((ok, no) => {
    if ([...document.scripts].some(s => s.src === src)) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error('offline'));
    document.head.appendChild(s);
  });
}

const EX = {
  ink: '14161A', ink2: '4A5058', mute: '7D848D', line: 'E4E4E0', soft: 'F5F5F3',
  accent: '2A78D6', accentSoft: 'D8E6FA', mark: '9AA1AA', warn: 'FAB219', crit: 'D03B3B', good: '0CA30C',

/* ── PDF ─────────────────────────────────────────────────────────────── */
async function toPdf(slides, name) {
  await loadScript(CDN.jspdf);
  const { jsPDF } = window.jspdf;
  const W = 960, H = 540, M = 52;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [W, H] });
  const hex = h => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  const fill = h => doc.setFillColor(...hex(h));
  const stroke = h => doc.setDrawColor(...hex(h));
  const ink = h => doc.setTextColor(...hex(h));
  const clip = (t, w, size) => {
    doc.setFontSize(size);
    let s = String(t);
    while (s.length > 2 && doc.getTextWidth(s) > w) s = s.slice(0, -2);
    return s === String(t) ? s : s + '…';
  };

  slides.forEach((sp, si) => {
    if (si) doc.addPage([W, H], 'landscape');
    doc.setFont('helvetica', 'normal');

    if (sp.kind === 'cover') {
      fill(EX.ink); doc.rect(0, 0, W, H, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(34); ink('FFFFFF');
      doc.text(sp.title, M, 250);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(15); ink('B9BEC6');
      doc.text(sp.sub, M, 282);
      doc.setFontSize(12); ink('8E959E'); doc.text(sp.line, M, 306);
      doc.setFontSize(10); doc.text(sp.foot, M, H - 44);
      return;
    }
    if (sp.kind === 'end') {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(26); ink(EX.ink);
      doc.text(sp.title, W / 2, H / 2, { align: 'center' });
      return;
    }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(17); ink(EX.ink);
    doc.text(clip(sp.title, W - 2 * M - 220, 17), M, 54);
    if (sp.sub) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); ink(EX.mute);
      doc.text(sp.sub, W - M, 54, { align: 'right' }); }
    stroke(EX.line); doc.setLineWidth(.8); doc.line(M, 68, W - M, 68);
    doc.setFontSize(7.5); ink(EX.mute); doc.text('Awign Enterprises', M, H - 22);
    doc.text(String(si), W - M, H - 22, { align: 'right' });

    let y = 92;
    if (sp.kpis) {
      const n = sp.kpis.length, gap = 10, w = (W - 2 * M - gap * (n - 1)) / n;
      sp.kpis.forEach((k, i) => {
        const x = M + i * (w + gap);
        fill(EX.soft); stroke(EX.line); doc.setLineWidth(.6);
        doc.roundedRect(x, y, w, 62, 5, 5, 'FD');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(6.6); ink(EX.mute);
        doc.text(k.label.toUpperCase(), x + 10, y + 16);
        doc.setFontSize(19); ink(EX.ink); doc.text(String(k.value), x + 10, y + 40);
        if (k.note) { doc.setFont('helvetica', 'normal'); doc.setFontSize(7.6); ink(EX.mute);
          doc.text(clip(k.note, w - 20, 7.6), x + 10, y + 53); }
      });
      y += 72;
    }
    if (sp.kpis2) {
      const n = sp.kpis2.length, gap = 10, w = (W - 2 * M - gap * (n - 1)) / n;
      sp.kpis2.forEach((k, i) => {
        const x = M + i * (w + gap);
        fill(EX.soft); stroke(EX.line); doc.setLineWidth(.6);
        doc.roundedRect(x, y, w, 62, 5, 5, 'FD');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(6.6); ink(EX.mute);
        doc.text(clip(k.label.toUpperCase(), w - 20, 6.6), x + 10, y + 16);
        doc.setFontSize(19); ink(EX.ink); doc.text(String(k.value), x + 10, y + 40);
      });
      y += 72;
    }
    if (sp.bullets) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); ink(EX.ink2);
      sp.bullets.forEach(b => {
        const lines = doc.splitTextToSize(b, W - 2 * M - 14);
        fill(EX.accent); doc.circle(M + 3, y - 3.4, 1.8, 'F');
        doc.text(lines, M + 14, y);
        y += lines.length * 13 + 6;
      });
      y += 4;
    }
    if (sp.bars) {
      const b = sp.bars, max = Math.max(...b.values, 1);
      const avail = (sp.note ? H - 118 : H - 46) - y;
      if (b.horizontal) {
        const rowH = Math.min(34, Math.max(14, avail / b.labels.length));
        const labW = 168, barX = M + labW + 10, barW = W - M - barX - 46;
        b.labels.forEach((lab, i) => {
          const cy = y + i * rowH;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); ink(EX.ink2);
          doc.text(clip(lab, labW, 8.5), M, cy + rowH / 2 + 3);
          fill('EEEEEA'); doc.roundedRect(barX, cy + rowH / 2 - 4.5, barW, 9, 4, 4, 'F');
          const w = Math.max(3, (b.values[i] / max) * barW);
          fill(b.color || (b.ordinal ? EX.ord[Math.min(i, 4)] : EX.accent));
          doc.roundedRect(barX, cy + rowH / 2 - 4.5, w, 9, 4, 4, 'F');
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); ink(EX.ink);
          doc.text(num(b.values[i]), W - M, cy + rowH / 2 + 3, { align: 'right' });
        });
        y += rowH * b.labels.length + 8;
      } else {
        const ch = Math.min(290, avail - 30), slot = (W - 2 * M) / b.labels.length, bw = Math.min(slot - 6, 26);
        b.values.forEach((v, i) => {
          const h = (v / max) * ch, x = M + i * slot + (slot - bw) / 2;
          const hot = !b.highlight || b.highlight.includes(i);
          fill(hot ? EX.accent : 'DFE2E6');
          doc.roundedRect(x, y + ch - h, bw, Math.max(2, h), 3, 3, 'F');
          doc.setFont('helvetica', 'normal'); doc.setFontSize(7); ink(EX.mute);
          doc.text(b.labels[i], x + bw / 2, y + ch + 12, { align: 'center' });
          if (hot && v > 0) { doc.setFontSize(7); ink(EX.ink2);
            doc.text(String(v), x + bw / 2, y + ch - h - 4, { align: 'center' }); }
        });
        stroke(EX.line); doc.line(M, y + ch, W - M, y + ch);
        y += ch + 26;
      }
    }
    if (sp.table) {
      const t = sp.table, tw = W - 2 * M, cols = t.w.map(f => f * tw);
      const xs = cols.reduce((a, c, i) => (a.push((a[i - 1] || M) + (i ? cols[i - 1] : 0)), a), []);
      const rowH = Math.min(19, Math.max(13, ((sp.note ? H - 120 : H - 54) - y) / (t.rows.length + 2)));
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7); ink(EX.mute);
      t.head.forEach((h, i) => {
        const right = t.align[i] === 'r';
        doc.text(clip(h.toUpperCase(), cols[i] - 6, 7), right ? xs[i] + cols[i] - 4 : xs[i], y + 9, { align: right ? 'right' : 'left' });
      });
      stroke(EX.line); doc.setLineWidth(.8); doc.line(M, y + 13, W - M, y + 13);
      y += 13;
      t.rows.forEach((r, ri) => {
        if (ri % 2) { fill('FBFBFA'); doc.rect(M, y, tw, rowH, 'F'); }
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
        r.forEach((cell, i) => {
          ink(i <= 1 ? EX.ink : EX.ink2);
          const right = t.align[i] === 'r';
          doc.text(clip(cell, cols[i] - 6, 8), right ? xs[i] + cols[i] - 4 : xs[i], y + rowH / 2 + 3, { align: right ? 'right' : 'left' });
        });
        stroke('F0F0EC'); doc.setLineWidth(.4); doc.line(M, y + rowH, W - M, y + rowH);
        y += rowH;
      });
      if (t.total) {
        fill('F2F2EF'); doc.rect(M, y, tw, rowH, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8); ink(EX.ink);
        t.total.forEach((cell, i) => {
          const right = t.align[i] === 'r';
          doc.text(clip(cell, cols[i] - 6, 8), right ? xs[i] + cols[i] - 4 : xs[i], y + rowH / 2 + 3, { align: right ? 'right' : 'left' });
        });
        y += rowH;
      }
      y += 10;
    }
    if (sp.foot) {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8); ink(EX.mute);
      doc.text(clip(sp.foot, W - 2 * M, 8), M, y + 8); y += 18;
    }
    if (sp.note) {
      const ny = Math.min(Math.max(y, H - 112), H - 96);
      stroke(EX.line); fill('FBFBFA'); doc.setLineWidth(.7);
      doc.setLineDashPattern([3, 3], 0);
      doc.roundedRect(M, ny, W - 2 * M, 56, 5, 5, 'FD');
      doc.setLineDashPattern([], 0);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6.6); ink(EX.mute);
      doc.text('COMMENTARY', M + 10, ny + 14);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.6); ink(EX.ink2);
      doc.text(doc.splitTextToSize(sp.note, W - 2 * M - 20).slice(0, 3), M + 10, ny + 27);
    }
  });
  doc.save(name + '.pdf');
}

async function exportDeck(kind) {
  const name = `Skild-Fetch_Awign_Review_${D.from}_to_${D.to}`;

  } catch (err) {
    toast('Export needs the internet to pull the generator library. ' + (err && err.message ? err.message : ''));
  }
}

    }
    let [a, bb, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
      const mj = (a & bb) ^ (a & c) ^ (bb & c);
      const t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    [a, bb, c, d, e, f, g, hh].forEach((x, i) => { h[i] = (h[i] + x) | 0; });
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha256(s) {
  try {
    if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch { /* fall through */ }
  return sha256js(s);
}

async function attemptSignIn() {
  const em = ($('#em').value || '').trim().toLowerCase();
  const pw = ($('#pw').value || '').trim();
  if (!em || !pw) return renderGate('Enter both your email and your password.');
  try {
    const u = DEMO_USERS.find(x => x.email === em);
    const h = await sha256(SALT + pw);
    if (!u) return renderGate(`No account on the sheet for "${em}".`);
    if (u.hash !== h) return renderGate('That password does not match. The demo password is zra-demo, all lowercase.');
    S.user = u;
    try { sessionStorage.setItem('zra.user', JSON.stringify(u)); } catch {}
    boot();
  } catch (err) {
    renderGate('Sign-in hit an error: ' + (err && err.message ? err.message : String(err)));
  }
}

/* customers × issue categories, the matrix from the tracker sheet */
function crossTab() {
  /* columns alphabetical, like the tracker sheet */
  const cats = D.cats.slice().sort((a, b) => a.name.localeCompare(b.name));
  const rows = D.customersShown.filter(c => c.total > 0);
  const colTotal = cats.map(cat => rows.reduce((a, c) => a + (c.cats[cat.id] || 0), 0));
  const grand = colTotal.reduce((a, b) => a + b, 0);
  /* one hue, light → dark with magnitude — the cell colour IS the reading */
  let hi = 0;
  rows.forEach(c => cats.forEach(cat => { hi = Math.max(hi, c.cats[cat.id] || 0); }));
  const heat = x => {
    if (!x) return 'h0';
    const r = x / (hi || 1);
    return r <= .04 ? 'h1' : r <= .12 ? 'h2' : r <= .30 ? 'h3' : r <= .60 ? 'h4' : 'h5';
  };
  return `<div class="xtabwrap" style="max-height:540px;overflow-y:auto">
    <table class="xtab">
      <thead><tr>
        <th class="xtab__num">#</th><th class="xtab__lead">Customers</th>
        ${cats.map(c => `<th class="xtab__rot"><span>${esc(c.name)}</span></th>`).join('')}
        <th class="xtab__tot">Total</th></tr></thead>
      <tbody>${rows.map((c, i) => `<tr>
        <td class="xidx">${i + 1}</td><td class="xname">${esc(c.name)}</td>
        ${cats.map(cat => { const x = c.cats[cat.id] || 0;
          return `<td class="${heat(x)}">${x}</td>`; }).join('')}
        <td class="xrowtot">${num(c.total)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td class="xname">Grand total</td>
        ${colTotal.map(v => `<td>${v}</td>`).join('')}
        <td class="xrowtot">${num(grand)}</td></tr></tfoot>
    </table></div>
    <div class="heatkey"><span>Fewer</span>
      <i style="background:var(--ord1)"></i><i style="background:var(--ord2)"></i>
      <i style="background:var(--ord3)"></i><i style="background:var(--ord4)"></i>
      <i style="background:var(--ord5)"></i><span>More tickets</span></div>
    ${grand < D.total ? `<div class="bandnote">Covers the ${rows.length} accounts carrying a named
      organisation — ${num(D.total - grand)} tickets arrived without one and are counted in the period
      totals only.</div>` : ''}`;
}

function noteHTML(id, ph) {
  const v = NOTES[noteKey(id)] || '';
  return `<div class="note" data-note="${id}">
    <div class="note__head">✎ Commentary — yours to write</div>
    <div class="note__body" contenteditable="true" data-ph="${esc(ph)}">${esc(v)}</div></div>`;
}
function wireNotes(scope) {
  scope.querySelectorAll('.note__body[contenteditable]').forEach(n => {
    /* innerText keeps the line breaks textContent throws away */
    n.addEventListener('input', () => {
      NOTES[noteKey(n.closest('[data-note]').dataset.note)] = n.innerText.replace(/\n{3,}/g, '\n\n').replace(/\s+$/, '');
      saveNotes(NOTES);
    });
    n.addEventListener('paste', e => {
      e.preventDefault();
      const t = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, t);
    });
  });
}
function secHTML(sec, i, withNote) {
  return `<section class="sec" data-sec="${sec.id}">
    <div class="sec__head">
      <span class="sec__no">${String(i + 1).padStart(2, '0')}</span>
      <div><div class="sec__title">${sec.title}</div>${sec.sub ? `<div class="sec__sub">${sec.sub}</div>` : ''}</div>
      ${sec.tag ? `<span class="sec__tag">${sec.tag}</span>` : ''}
    </div>
    <div class="sec__body">${sec.html}${withNote ? noteHTML(sec.id, sec.ph) : noteStatic(sec.id)}</div>
  </section>`;
}
function noteStatic(id) {
  const v = (NOTES[noteKey(id)] || '').trim();
  return v ? `<div class="note"><div class="note__body">${esc(v)}</div></div>` : '';
}

function viewReview() {
  const secs = reviewSections();
  $('#content').innerHTML = `<div class="review">
    <div class="rhead">
      <div><h2>Skild-Fetch &lt;&gt; Awign · Call Support Operations Review</h2>
        <p>${fmtDate(D.from)} – ${fmtDate(D.to)} · ${num(D.total)} tickets</p></div>
    </div>
    ${secs.map((sec, i) => secHTML(sec, i, true)).join('')}
  </div>`;
  secs.forEach(sec => {
    if (sec.mount) sec.mount(document.querySelector(`[data-sec="${sec.id}"] .sec__body`));
  });
  wireNotes($('#content'));
  wireToggles($('#content'));
  revealOn($('#content'));
}

function wireToggles(scope) {
  scope.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.toggle;
    S.show[k] = !S.show[k];
    const y = scrollY;
    if (PRESENT) { const s = PRESENT.box.scrollTop; endPresent(); startPresent(); PRESENT.box.scrollTop = s; }
    else { render(); scrollTo(0, y); }
  }));
}

/* sections settle in as they come into view — M3 emphasised decelerate */
let REVEAL_IO = null;
function revealOn(scope) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (REVEAL_IO) REVEAL_IO.disconnect();
  REVEAL_IO = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('reveal--in');
      REVEAL_IO.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: .04 });
  scope.querySelectorAll('.sec, .rhead').forEach((n, i) => {
    n.classList.add('reveal');
    n.style.animationDelay = Math.min(i, 3) * 40 + 'ms';
    REVEAL_IO.observe(n);
  });
}

/* ── presentation mode — one continuous full-screen document ─────────── */
let PRESENT = null;
function startPresent() {
  const secs = reviewSections();
  const box = document.createElement('div');
  box.className = 'present';
  box.innerHTML = `<button class="btn present__exit" id="pexit">✕ Exit</button>
    <div class="present__inner">
      <div class="pcover">
        <h1>Skild-Fetch &lt;&gt; Awign</h1>
        <p class="pcover__period">${fmtDate(D.from)} – ${fmtDate(D.to)}</p>
        <p class="pcover__line">Call Support Operations — Performance Review</p>
        <div class="pcover__org">Awign Enterprises</div>
      </div>
      ${secs.map((sec, i) => secHTML(sec, i, false)).join('')}
      <div class="present__end">AWIGN ENTERPRISES · END OF REVIEW</div>
    </div>`;
  document.body.appendChild(box);
  PRESENT = { box, secs };
  secs.forEach(sec => {
    if (sec.mount) sec.mount(box.querySelector(`[data-sec="${sec.id}"] .sec__body`));
  });
  wireToggles(box);
  const fs = box.requestFullscreen || box.webkitRequestFullscreen;
  if (fs) { try { const r = fs.call(box); if (r && r.catch) r.catch(() => {}); } catch {} }
  box.querySelector('#pexit').addEventListener('click', endPresent);
  document.addEventListener('keydown', presentKeys);
}
function endPresent() {
  if (!PRESENT) return;
  document.removeEventListener('keydown', presentKeys);
  PRESENT.box.remove(); PRESENT = null;
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch {} }
}
function presentKeys(e) {
  if (PRESENT && e.key === 'Escape') endPresent();
}

/* ── render ──────────────────────────────────────────────────────────── */
function render() {
  const r = S.range || { from: bounds.from, to: bounds.to };
  D = derive(r.from, r.to);
  const pv = prevPeriod(r.from, r.to);
  P = pv ? { from: pv.from, to: pv.to, whole: pv.whole, d: derive(pv.from, pv.to), days: daysBetween(r.from, r.to) + 1 } : null;
  shell();
  if (S.view === 'review') viewReview(); else viewOverview();
}
function boot() { render(); }

let rT;
addEventListener('resize', () => {
  clearTimeout(rT);
  rT = setTimeout(() => { if (!PRESENT && S.user) render(); }, 180);
});

(function init() {
  try { document.documentElement.dataset.theme = localStorage.getItem('zra.theme') || 'light'; } catch {}
  let u = null;
  try { u = JSON.parse(sessionStorage.getItem('zra.user') || 'null'); } catch {}
  if (u) { S.user = u; boot(); } else renderGate();
})();

</script>
